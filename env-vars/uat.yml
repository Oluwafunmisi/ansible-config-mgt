enable_nginx_lb: true
enable_apache_lb: false
load_balancer_is_required: true

nginx_vhosts:
  - listen: "80"
    server_name: "_"
    index: "index.html index.htm"
    extra_parameters: |
      location / {
        proxy_pass http://myapp1;
      }

nginx_upstreams:
  - name: myapp1
    servers:
      - "172.31.35.71"
      - "172.31.36.230"