---
- name: Remove wireshark from web and nfs servers
  hosts: webservers,nfs
  remote_user: ec2-user
  become: yes
  become_user: root

  tasks:
    - name: Delete wireshark
      yum:
        name: wireshark
        state: absent

- name: Remove wireshark from db and lb servers
  hosts: db,lb
  remote_user: ubuntu
  become: yes
  become_user: root

  tasks:
    - name: Delete wireshark
      apt:
        name: wireshark
        state: absent
        autoremove: yes
        purge: yes
        update_cache: yes