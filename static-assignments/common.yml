---
- name: Update web servers
  hosts: webservers
  remote_user: ec2-user
  become: true
  become_user: root
  tasks:
    - name: Ensure wireshark is at the latest version
      yum:
        name: wireshark
        state: latest

- name: Update LB and DB servers
  hosts: lb, db
  remote_user: ec2-user
  become: true
  become_user: root
  tasks:

  - name: Update yum repo
    ansible.builtin.yum:
      name: "*"
      state: latest

  - name: Ensure wireshark is at the latest version
    ansible.builtin.yum:
      name: wireshark
      state: latest